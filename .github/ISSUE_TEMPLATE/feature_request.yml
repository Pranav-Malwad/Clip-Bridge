name: Feature request
description: Suggest a privacy-conscious improvement to ClipBridge.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include real clipboard content, pairing data, credentials, or personal information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe what the Windows and Android user should see and do.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security considerations
      description: Explain what data the feature handles and where it would be stored or transmitted.
    validations:
      required: true
